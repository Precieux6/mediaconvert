services:
  - type: web
    name: omniconvert-api
    runtime: docker
    region: frankfurt
    
    # Port et santé
    port: 8000
    healthCheckPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 10
    
    # Ressources
    plan: standard
    
    # Environnement
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: MAX_FILE_SIZE
        value: "524288000"
      - key: RENDER
        value: "true"

    # Auto-deploy depuis GitHub
    autoDeploy: true
    
    # Scaling
    minInstances: 1
    maxInstances: 1
